<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SABATHIA WS — Adaptive Study Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" />
<style>
  :root{
    --bg:#111111; --surf:#242424; --surf2:#1B1B1B; --hover:#2C2C2C;
    --ink:#F1F0EC; --ink2:#BDBBB5; --ink3:#94928C; --ink4:#5C5B58;
    --line:rgba(241,240,236,.08); --line2:rgba(241,240,236,.16); --trk:rgba(241,240,236,.1);
    --plan:#8A8884; --hot:#FF4A1C; --red:var(--hot); --amber:var(--ink2);
    --eng:#B5B3AD; --kor:#85837E; --math:#F1F0EC; --school:#66645F;
    --spring:cubic-bezier(.32,.72,0,1);
    --sans:"SUIT Variable","SUIT",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    --disp:"Archivo Black","Arial Black",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  /* Light context: NOW window is the one off-white sheet on the desk */
  #w-now,.toast{
    --surf:#F1F0EC; --surf2:#E6E4DE; --hover:#E8E6E0;
    --ink:#111111; --ink2:#3D3C3A; --ink3:#6B6965; --ink4:#A3A19B;
    --line:rgba(17,17,17,.1); --line2:rgba(17,17,17,.2); --trk:rgba(17,17,17,.1);
  }
  /* Dark context nested inside the light sheet */
  #w-now .hw[aria-checked="true"],#w-now .run,#w-now .btn-primary{
    --surf:#111111; --surf2:#1B1B1B; --hover:#1E1E1E;
    --ink:#F1F0EC; --ink2:#BDBBB5; --ink3:#94928C; --ink4:#5C5B58;
    --line:rgba(241,240,236,.1); --line2:rgba(241,240,236,.2); --trk:rgba(241,240,236,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0B0B0B;overflow-x:hidden}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .num{font-family:var(--mono),var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .disp{font-family:var(--disp);font-weight:400;letter-spacing:-.02em}

  /* ---------- Stage ---------- */
  #stage{position:relative;width:1366px;height:1024px;transform-origin:0 0;overflow:hidden;background-color:var(--bg);
    background-image:linear-gradient(90deg,rgba(241,240,236,.028) 1px,transparent 1px);
    background-size:110.5px 100%;background-position:20px 0}
  .grid-h{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s var(--spring);
    background-image:radial-gradient(rgba(241,240,236,.09) 1px,transparent 1.2px);background-size:24px 24px;background-position:20px 4px}
  #stage.free .grid-h{opacity:1}
  .bg-word{position:absolute;left:10px;bottom:-74px;font-family:var(--disp);font-size:300px;line-height:1;letter-spacing:-.065em;color:transparent;-webkit-text-stroke:1px rgba(241,240,236,.07);pointer-events:none;user-select:none;white-space:nowrap}
  .bg-meta{position:absolute;right:22px;bottom:84px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--ink4);text-align:right;text-transform:uppercase;letter-spacing:.1em;pointer-events:none}

  /* ---------- Top bar ---------- */
  .topbar{position:absolute;left:20px;right:20px;top:0;height:60px;display:flex;align-items:center;gap:18px;z-index:200;border-bottom:1px solid var(--line2)}
  .brand{display:flex;align-items:flex-end;gap:12px}
  .brand .disp{font-size:30px;line-height:.8;letter-spacing:-.055em;color:var(--ink)}
  .brand .tag{font-family:var(--mono);font-size:10px;line-height:1.25;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;padding-bottom:1px}
  .brand .tag b{display:block;color:var(--ink);font-weight:600}
  .seg{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line)}
  .seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--ink);transition:transform .45s var(--spring),width .45s var(--spring)}
  .seg button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:32px;padding:0 16px;font-size:13px;font-weight:600;color:var(--ink3);transition:color .3s}
  .seg button[aria-pressed="true"]{color:var(--bg);font-weight:750}
  .mode-seg{margin-left:auto;margin-right:auto;transform:translateX(60px)}
  .tb-right{display:flex;align-items:center;gap:16px;font-size:12.5px;color:var(--ink3);font-weight:500}
  .tb-right .clock{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:24px;letter-spacing:-.05em}
  .tb-btn{height:32px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--ink);background:var(--surf);box-shadow:inset 0 0 0 1px var(--line2);opacity:0;pointer-events:none;transition:opacity .3s,background .2s,color .2s}
  #stage.free .tb-btn,#stage.has-closed .tb-btn{opacity:1;pointer-events:auto}
  .tb-btn:hover{background:var(--ink);color:var(--bg)}

  /* ---------- Windows ---------- */
  .win{position:absolute;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surf);color:var(--ink);visibility:visible;
    box-shadow:inset 0 0 0 1px var(--line),0 14px 34px -12px rgba(0,0,0,.6);
    transition:left .6s var(--spring),top .6s var(--spring),width .6s var(--spring),height .6s var(--spring),box-shadow .35s,opacity .35s,filter .4s,transform .45s var(--spring),visibility 0s}
  #stage.free .win{box-shadow:inset 0 0 0 1px var(--line),0 18px 40px -14px rgba(0,0,0,.7)}
  #stage.free .win.front{box-shadow:inset 0 0 0 1px var(--line2),0 28px 60px -18px rgba(0,0,0,.85)}
  #stage.free .win:not(.front) .wt{color:var(--ink3)}
  .win.dragging{transition:box-shadow .2s,transform .25s var(--spring);transform:scale(1.008);box-shadow:inset 0 0 0 1px var(--line2),0 36px 70px -16px rgba(0,0,0,.9)!important}
  .win.resizing{transition:box-shadow .2s}
  .win.dim{opacity:.3;filter:blur(1px);transform:scale(.985);pointer-events:none}
  .win.focused{box-shadow:inset 0 0 0 1px var(--line2),0 40px 90px -20px rgba(0,0,0,.9)}
  .win.closed{opacity:0;transform:scale(.96) translateY(10px);pointer-events:none;visibility:hidden;transition:opacity .3s,transform .4s var(--spring),visibility 0s .4s}

  .wh{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;border-bottom:1px solid var(--line);transition:background .2s}
  .wh:hover{background:var(--hover)}
  .win.dragging .wh{cursor:grabbing}
  .wi{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink4);letter-spacing:.04em}
  .wi::before{content:"No."}
  .wt{font-family:var(--disp);font-size:16px;letter-spacing:-.02em;line-height:1;color:var(--ink);transition:color .3s}
  .ws{font-size:12px;color:var(--ink3);font-weight:500}
  .wc{margin-left:auto;display:flex;gap:2px;align-items:center}
  .wbtn{width:30px;height:30px;border-radius:999px;color:var(--ink3);display:grid;place-items:center;transition:background .15s,color .15s,transform .15s}
  .wbtn:hover{background:var(--line2);color:var(--ink)}
  .wbtn.cls:hover{background:var(--hot);color:#111}
  .wbtn:active{transform:scale(.9)}
  .wbtn svg{transition:transform .45s var(--spring)}
  .win.collapsed .wbtn.col svg{transform:rotate(-90deg)}
  .win.collapsed .wh{border-bottom-color:transparent}
  .wb{flex:1;min-height:0;overflow:auto;container-type:inline-size;padding:18px 20px 20px;transition:opacity .3s}
  .wb::-webkit-scrollbar{width:0}
  .win.collapsed .wb{opacity:0;pointer-events:none}
  .rz{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;touch-action:none;opacity:0;pointer-events:none;transition:opacity .3s}
  .rz::after{content:"";position:absolute;right:7px;bottom:7px;width:8px;height:8px;border-right:1.5px solid var(--ink4);border-bottom:1.5px solid var(--ink4);border-bottom-right-radius:3px}
  #stage.free .win:not(.collapsed):not(.focused) .rz{opacity:1;pointer-events:auto}
  .scrim{position:absolute;inset:0;background:rgba(10,10,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s;z-index:90}
  .scrim.on{opacity:1;pointer-events:auto}

  /* NOW = the only off-white sheet: loudest surface */
  #w-now{box-shadow:0 20px 50px -16px rgba(0,0,0,.8)}
  #stage.free #w-now,#stage.free #w-now.front,#w-now.focused{box-shadow:0 30px 70px -18px rgba(0,0,0,.9)}
  #w-now .wt{font-size:18px}
  #stage.free #w-now:not(.front) .wt{color:var(--ink)}
  .link-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink3);border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);margin-right:6px}

  /* ---------- Shared bits ---------- */
  .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
  .pill.live{background:var(--ink);box-shadow:none;color:var(--surf)}
  .pill.live i{width:7px;height:7px;border-radius:50%;background:var(--hot);animation:blink 1.6s steps(2,start) infinite}
  .pill.done{color:var(--ink3)}
  @keyframes blink{to{visibility:hidden}}
  .sec-label{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 10px}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .sec-label .kr{font-family:var(--sans);font-size:12px;letter-spacing:-.01em;text-transform:none;font-weight:700;color:var(--ink)}
  .track{position:relative;height:6px;border-radius:999px;background:var(--trk);overflow:hidden}
  .track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c,var(--ink));transition:width 1s var(--spring)}
  .track.ticks::after{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,transparent calc(100% - 2px),var(--surf) 0);background-size:var(--tick) 100%}
  .segs{display:flex;gap:2px;height:6px}
  .segs span{flex:1;background:var(--trk);transition:background .5s,transform .4s var(--spring)}
  .segs span:first-child{border-radius:999px 0 0 999px}
  .segs span:last-child{border-radius:0 999px 999px 0}
  .segs span.on{background:var(--c,var(--ink))}
  .segs span.pop{animation:pop .6s var(--spring)}
  @keyframes pop{0%{transform:scaleY(2.6)}100%{transform:scaleY(1)}}

  /* ---------- NOW ---------- */
  .now-top{display:flex;align-items:center;gap:10px}
  .now-time{font-size:13px;color:var(--ink2)}
  .now-plan{margin-left:auto;font-size:11px;color:var(--ink3);letter-spacing:.04em}
  .now-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;margin-top:22px}
  .now-title{font-size:64px;line-height:.92;font-weight:850;letter-spacing:-.065em;color:var(--ink);word-break:keep-all}
  .now-left{display:flex;align-items:flex-end;gap:10px}
  .now-left .big{font-size:80px;font-weight:500;line-height:.8;letter-spacing:-.08em;color:var(--ink)}
  .now-left .cap{display:flex;flex-direction:column;gap:3px;padding-bottom:1px;font-size:11.5px;font-weight:600;color:var(--ink3)}
  .now-left .cap b{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--ink)}
  .pips{display:flex;align-items:center;gap:3px;margin-top:18px}
  .pips .lbl{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-right:8px;white-space:nowrap;letter-spacing:.04em}
  .pip{position:relative;flex:1;height:10px;background:var(--trk);overflow:hidden}
  .pip:first-of-type{border-radius:999px 0 0 999px}
  .pip:last-child{border-radius:0 999px 999px 0}
  .pip i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width 1s var(--spring)}
  .hw-list{display:grid;grid-template-columns:1fr;gap:8px}
  @container (min-width:500px){.hw-list{grid-template-columns:1fr 1fr}}
  .hw{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink);transition:background .25s,box-shadow .25s,transform .2s var(--spring);min-height:104px}
  .hw:hover{box-shadow:inset 0 0 0 1px var(--ink3)}
  .hw:active{transform:scale(.985)}
  .hw[aria-checked="true"]{background:var(--surf);box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
  .hw-head{display:flex;align-items:flex-start;gap:10px}
  .radio{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink4);display:grid;place-items:center;margin-top:2px;transition:background .2s,border-color .2s}
  .hw[aria-checked="true"] .radio{border-color:var(--ink)}
  .hw[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
  .hw-title{font-size:15px;font-weight:700;line-height:1.35;word-break:keep-all}
  .hw-sub{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:auto}
  .hw-sub b{color:var(--ink);font-size:14px;font-weight:500}
  .hw .segs span.on,.hw .track .fill{background:var(--ink)}
  .hw.complete{opacity:.5}
  .hw.complete .hw-title{text-decoration:line-through;text-decoration-thickness:1.5px}
  .now-actions{margin-top:14px}
  .btn-primary{width:100%;height:58px;border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 22px;font-size:15.5px;font-weight:750;color:var(--ink);background:var(--surf);transition:transform .2s var(--spring),background .2s}
  .btn-primary:hover{background:#000}
  .btn-primary:active{transform:scale(.985)}
  .btn-primary small{margin-left:auto;font-weight:500;color:var(--ink3);font-size:12.5px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #w-now .btn-primary[disabled]{background:#E1DFD9;color:#6B6965;cursor:default}
  .run{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 18px;border-radius:14px;background:var(--surf);color:var(--ink)}
  .run-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .run-info span{font-size:11.5px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .run-info span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hot);margin-right:7px;vertical-align:1px;animation:blink 1.6s steps(2,start) infinite}
  .run-info .run-timer{font-size:30px;font-weight:500;color:var(--ink);line-height:1.05}
  .btn-sm{height:44px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;transition:transform .15s,background .15s,color .15s}
  .btn-sm:active{transform:scale(.96)}
  .btn-sm.pri{background:var(--ink);color:var(--surf)}
  .btn-sm.pri:hover{background:#fff}
  .btn-sm.ghost{box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
  .btn-sm.ghost:hover{background:var(--line2);color:var(--ink)}
  .btn-sm.sq{width:44px;padding:0;justify-content:center}
  .next-row{margin-top:14px;display:flex;align-items:center;gap:10px;width:100%;padding:12px 2px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink3);font-weight:500;transition:color .2s}
  .next-row:hover{color:var(--ink)}
  .next-row .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em}
  .next-row b{color:var(--ink);font-weight:700}
  .next-row .sw{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--ink3)}
  .next-row .arr{margin-left:auto}

  /* ---------- TODAY ---------- */
  .td-head{display:flex;align-items:flex-end;gap:14px}
  .td-big{font-size:68px;font-weight:500;line-height:.8;letter-spacing:-.08em}
  .td-cap{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:500;color:var(--ink3)}
  .td-cap b{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--ink)}
  .td-key{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
  .td-key i{width:20px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--ink3)}
  .tiles{display:flex;align-items:flex-end;gap:5px;margin-top:22px}
  .tile-wrap{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
  .tile{position:relative;height:56px;overflow:hidden;border-radius:7px;background:var(--surf2);box-shadow:inset 0 0 0 1px var(--line)}
  .tile .s{position:absolute;top:0;bottom:0;transition:width 1.1s var(--spring)}
  .tile .s.done{background:var(--ink)}
  .tile .s.plan{background:var(--plan)}
  .tile .s.free{background:repeating-linear-gradient(135deg,rgba(241,240,236,.22) 0 1.5px,transparent 1.5px 6px)}
  .tile .q{position:absolute;top:0;height:8px;width:1px;background:rgba(17,17,17,.4)}
  .tile .q.dk{background:var(--line2)}
  .tile-lbl{font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:right}
  .now-mark{flex:none;width:2px;align-self:stretch;margin:-8px 2px 22px;background:var(--hot);position:relative;border-radius:2px}
  .now-mark span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--hot);white-space:nowrap}
  .legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px;font-size:12px;color:var(--ink3);font-weight:500}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i{width:10px;height:10px;border-radius:3px}
  .legend b{font-weight:500;color:var(--ink)}
  .legend .done i{background:var(--ink)}
  .legend .plan i{background:var(--plan)}
  .legend .free i{background:repeating-linear-gradient(135deg,rgba(241,240,236,.5) 0 1.5px,transparent 1.5px 3.5px);box-shadow:inset 0 0 0 1px var(--line2)}
  .legend .of{color:var(--ink4);font-weight:500}
  .strip{display:none;margin-top:24px}
  @container (min-width:900px){.strip{display:block}}
  .strip-bar{position:relative;height:36px;border-radius:8px;background:var(--surf2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
  .strip-bar i{position:absolute;top:7px;bottom:7px;border-radius:3px}
  .strip-ax{position:relative;height:18px;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .strip-ax span{position:absolute;transform:translateX(-50%)}

  /* ---------- DEADLINES ---------- */
  .dl-tools{display:flex;gap:2px;padding:2px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);margin-right:6px}
  .dl-tools button{height:24px;padding:0 11px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink3);transition:color .2s,background .2s}
  .dl-tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .grp+.grp{border-top:1px solid var(--line2)}
  .grp-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 4px}
  .grp-h:hover .grp-name{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
  .badge{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--c)}
  .grp-name{font-size:15.5px;font-weight:750;letter-spacing:-.02em}
  .grp-name em{font-style:normal;color:var(--ink3);font-weight:500;margin-left:2px}
  .grp-meta{font-size:12px;color:var(--ink3);font-weight:500;margin-top:2px}
  .grp-meta .warn{color:var(--hot);font-weight:700}
  .grp-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .grp-pct{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink2)}
  .ring{width:28px;height:28px}

<script>
(() => {
  // ---------- Icons ----------
  const P = {
    chevron:'<path d="M6 9l6 6 6-6"/>',

    play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>',
    check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    stop:'<rect x="7" y="7" width="10" height="10" fill="currentColor" stroke="none"/>',
    grid:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
    free:'<rect x="3.5" y="4.5" width="10" height="8"/><rect x="10.5" y="11.5" width="10" height="8"/>',
    arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
    reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/>',
    link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
  };
  const ic = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">${P[n]}</svg>`;
  document.querySelectorAll('[data-ic]').forEach(el => el.outerHTML = ic(el.dataset.ic));

  // ---------- Data ----------
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const hmShort = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
  const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const BED = toMin('23:20');
  const T0 = Date.now(), START_CLOCK = toMin('18:58');
  const clockMin = () => START_CLOCK + Math.floor((Date.now() - T0) / 60000);

  const groups = [
    { id: 'baekin', name: '백인대장', sub: '수학', badge: '백', c: 'var(--math)' },

  const tasks = [
    { id: 'm1', g: 'baekin', title: '수평잡기 명제 오답 및 마무리', done: 9, total: 14, unit: '문항', dday: 1, date: '11/19 목', pace: 2.5 },
    { id: 'm2', g: 'baekin', title: '수평잡기 함수 313~395번', done: 40, total: 83, unit: '문제', dday: 2, date: '11/20 금', pace: 2.4, risk: 'high', note: '마감 전 계획 45분 · 약 1시간 부족' },
    { id: 'm4', g: 'baekin', title: '합성함수 프린트', done: 4, total: 12, unit: '문제', dday: 2, date: '11/20 금', pace: 2.5 },
    { id: 'm3', g: 'baekin', title: '수평잡기 함수 396~455번', done: 0, total: 60, unit: '문제', dday: 6, date: '11/24 화', pace: 2.5 },
    { id: 's1', g: 'school', title: '심화아카데미 보고서 제출', done: 2, total: 5, unit: '단계', dday: 3, date: '11/21 토', pace: 55, risk: 'watch', note: '분량 큼 · 금요일까지 2단계 필요' },
    { id: 'k1', g: 'kor', title: '국어 숙제', done: 0, total: 24, unit: '문제', dday: 1, date: '11/19 목', pace: 1.5 },
    { id: 'e1', g: 'eng', title: '영어 문법 문제풀이', done: 12, total: 30, unit: '문제', dday: 1, date: '11/19 목', pace: 1.2 },
    { id: 'e2', g: 'eng', title: '영어 독해 문제풀이', done: 2, total: 6, unit: '지문', dday: 1, date: '11/19 목', pace: 6 },
  ];
  const T = id => tasks.find(t => t.id === id);
  const blocks = [
    { id: 'b1', start: '17:10', end: '18:00', title: '수학 오답', c: 'var(--math)', tasks: ['m1'] },
    { id: 'fx1', start: '18:00', end: '18:40', title: '저녁', fixed: true },
    { id: 'b2', start: '18:52', end: '19:37', title: '영어 풀이', c: 'var(--eng)', tasks: ['e1', 'e2'] },
    { id: 'b3', start: '19:45', end: '20:20', title: '국어 숙제', c: 'var(--kor)', tasks: ['k1'] },
    { id: 'b4', start: '20:30', end: '21:15', title: '수학 숙제', c: 'var(--math)', tasks: ['m2', 'm4'] },

  const B = id => blocks.find(b => b.id === id);
  const blockOfTask = tid => blocks.find(b => b.tasks && b.tasks.includes(tid) && toMin(b.end) > clockMin()) || blocks.find(b => b.tasks && b.tasks.includes(tid));
  const blockState = b => { const n = clockMin(); return toMin(b.end) <= n ? 'done' : toMin(b.start) <= n ? 'now' : 'next'; };

  // ---------- State ----------
  const W = 1366, H = 1024, TOP = 76, PAD = 20, GAP = 12, HEAD = 48;
  const ids = ['now', 'today', 'dl', 'pl'];

  const freeDefault = () => ({
    now: { x: 48, y: 96, w: 560, h: 540 },

  const S = {
    mode: 'organized', focus: null, collapsed: {}, closed: {}, order: ['pl', 'dl', 'today', 'now'],
    free: freeDefault(), selBlock: 'b2', selHw: {}, sort: 'group',
    open: { baekin: true, school: true, kor: true, eng: false },
    running: null, workedSec: 0, pop: null,

  const anyClosed = () => ids.some(id => S.closed[id]);

  // ---------- Layout ----------
  function orgRects() {
    const avail = H - TOP - PAD - (anyClosed() ? 64 : 0);
    const L = ['now', 'pl'].filter(id => !S.closed[id]), R = ['today', 'dl'].filter(id => !S.closed[id]);
    const full = W - PAD * 2;
    let lw = 588, rx = PAD + lw + GAP, rw = full - lw - GAP;
    if (!L.length) { rx = PAD; rw = full; }
    if (!R.length) lw = full;
    const pref = { now: 540, today: 272 };
    const col = (list, x, w) => {
      if (!list.length) return {};
      if (list.length === 1) { const a = list[0]; return { [a]: { x, y: TOP, w, h: S.collapsed[a] ? HEAD : avail } }; }
      const [a, b] = list, ca = S.collapsed[a], cb = S.collapsed[b];
      const ha = ca ? HEAD : (cb ? avail - GAP - HEAD : pref[a]);
      const hb = cb ? HEAD : avail - GAP - ha;
      return { [a]: { x, y: TOP, w, h: ha }, [b]: { x, y: TOP + ha + GAP, w, h: hb } };
    };
    return { ...col(L, PAD, lw), ...col(R, rx, rw) };
  }
  const focusRect = { x: 120, y: 88, w: 1126, h: 880 };
  const stage = document.getElementById('stage');
  const win = id => document.getElementById('w-' + id);
  function applyLayout() {
    stage.className = S.mode === 'free' ? 'free' : 'organized';
    stage.classList.toggle('has-closed', anyClosed());
    const org = S.mode === 'organized' ? orgRects() : null;
    ids.forEach(id => {
      const el = win(id), closed = !!S.closed[id];
      el.classList.toggle('closed', closed);
      el.inert = closed;
      if (!closed) {
        const r = S.focus === id ? focusRect : org ? org[id] : { ...S.free[id], h: S.collapsed[id] ? HEAD : S.free[id].h };
        Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      }
      el.style.zIndex = S.focus === id ? 100 : 10 + S.order.indexOf(id);
      el.classList.toggle('collapsed', !!S.collapsed[id] && S.focus !== id);
      el.classList.toggle('focused', S.focus === id);
      el.classList.toggle('dim', !!S.focus && S.focus !== id);
      el.classList.toggle('front', S.mode === 'free' && S.order[S.order.length - 1] === id);
      const fb = el.querySelector('.foc');
      fb.innerHTML = ic(S.focus === id ? 'shrink' : 'expand');
      fb.setAttribute('aria-label', S.focus === id ? '집중 보기 닫기' : '집중 보기');
      el.querySelector('.col').setAttribute('aria-expanded', String(!S.collapsed[id]));
    });
    document.getElementById('scrim').classList.toggle('on', !!S.focus);
    document.querySelectorAll('[data-act="mode"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
    const active = document.querySelector(`[data-act="mode"][data-mode="${S.mode}"]`);
    const thumb = document.getElementById('segThumb');
    thumb.style.width = active.offsetWidth + 'px';
    thumb.style.transform = `translateX(${active.offsetLeft - 2}px)`;
    renderDock();
  }
  const front = id => { S.order = S.order.filter(x => x !== id).concat(id); };

  // ---------- Progress helpers ----------
  const prevW = {};
  function prog(t, key) {
    const p = t.done / t.total * 100;
    if (t.total <= 30) {
      return `<div class="segs" style="--c:${groupOf(t).c}">${Array.from({ length: t.total }, (_, i) =>
        `<span class="${i < t.done ? 'on' : ''}${S.pop === t.id && i === t.done - 1 ? ' pop' : ''}"></span>`).join('')}</div>`;
    }
    return `<div class="track ticks" style="--c:${groupOf(t).c};--tick:${(1000 / t.total).toFixed(3)}%"><i class="fill" data-k="${key}" data-p="${p}" style="width:${prevW[key] ?? 0}%"></i></div>`;
  }
  const groupOf = t => groups.find(g => g.id === t.g);
  const r10 = v => Math.max(5, Math.round(v / 5) * 5);
  function estimate(t) {
    const rem = t.total - t.done;
    if (rem <= 0) return { main: '완료', sub: '' };
    if (t.done >= 2) { const base = rem * t.pace; return { main: `약 ${dur(r10(base * .85))}`, sub: `~${dur(r10(base * 1.25))}` }; }
    const b = blockOfTask(t.id);
    if (b) return { main: `계획 ${dur(toMin(b.end) - toMin(b.start))}`, sub: '진행 후 추정' };
    return { main: '—', sub: '진행 후 추정' };
  }
  const urgency = t => t.done >= t.total ? 'calm' : t.risk === 'high' ? 'risk' : t.dday <= 1 ? 'near' : t.dday <= 3 ? 'attention' : 'calm';
  const RAIL = { calm: 'var(--line2)', attention: 'var(--ink3)', near: 'var(--ink)', risk: 'var(--hot)' };
  const DUE = {
    calm: ['rgba(241,240,236,.07)', 'var(--ink3)'],
    attention: ['rgba(241,240,236,.18)', 'var(--ink)'],
    near: ['var(--ink)', 'var(--bg)'],
    risk: ['var(--hot)', '#111'],
  };
  const ddayTxt = d => d === 0 ? '오늘' : d === 1 ? '내일' : `D-${d}`;

  // ---------- NOW ----------
  function renderNow() {
    const n = clockMin();
    const b = B(S.running ? S.running.block : S.selBlock);
    const st = blockState(b), len = toMin(b.end) - toMin(b.start);
    const el = clamp(n - toMin(b.start), 0, len);
    const list = b.tasks.map(T);
    let sel = S.selHw[b.id];
    if (!sel || !b.tasks.includes(sel)) sel = (list.find(t => t.done < t.total) || list[0]).id;
    S.selHw[b.id] = sel;
    const pill = st === 'now' ? '<span class="pill live"><i></i>Live · 지금</span>' : st === 'done' ? `<span class="pill done">${ic('check', 12)}완료</span>` : '<span class="pill">Next · 다음 예정</span>';
    const big = st === 'now' ? { v: len - el, k: 'MIN LEFT', s: '남음' } : st === 'next' ? { v: toMin(b.start) - n, k: 'MIN TO GO', s: '후 시작' } : { v: '—', k: 'ENDED', s: '블록 종료' };
    const pips = Array.from({ length: Math.ceil(len / 15) }, (_, i) => {
      const f = clamp((el - i * 15) / Math.min(15, len - i * 15), 0, 1) * 100;
      return `<span class="pip" title="15분"><i data-k="pip-${b.id}-${i}" data-p="${f}" style="width:${prevW['pip-' + b.id + '-' + i] ?? 0}%"></i></span>`;
    }).join('');
    const cards = list.map(t => {
      const e = estimate(t), on = t.id === sel, c = t.done >= t.total;
      return `<button class="hw${c ? ' complete' : ''}" role="radio" aria-checked="${on}" data-act="selhw" data-id="${t.id}" data-task="${t.id}">
        <span class="hw-head"><span class="radio"></span><span class="hw-title">${t.title}</span></span>
        ${prog(t, 'now-' + t.id)}
        <span class="hw-sub"><span class="num"><b>${t.done}</b> / ${t.total}${t.unit}</span><span>${e.main}</span></span>
      </button>`;
    }).join('');
    let actions;
    if (S.running) {
      const t = T(S.running.task);
      actions = `<div class="run"><div class="run-info"><span>진행 중 · ${t.title}</span><span class="run-timer num" id="timer">00:00</span></div>
        <button class="btn-sm ghost sq" data-act="minus" aria-label="1개 취소">${ic('minus')}</button>
        <button class="btn-sm pri" data-act="plus">${ic('plus')}1${t.unit} 완료</button>
        <button class="btn-sm ghost" data-act="stop">${ic('stop', 12)}종료</button></div>`;
    } else if (st === 'done') {
      actions = `<button class="btn-primary" disabled>이미 지난 블록</button>`;
    } else {
      actions = `<button class="btn-primary" data-act="start">${ic('play', 15)}선택한 숙제 시작<small>${T(sel).title}</small></button>`;
    }
    const nx = blocks.find(x => !x.fixed && toMin(x.start) > toMin(b.start));
    document.getElementById('b-now').innerHTML = `
      <div class="now-top">${pill}<span class="now-time num">${b.start}–${b.end}</span><span class="now-plan num">PLAN ${dur(len)}</span></div>
      <div class="now-hero">
        <h2 class="now-title">${b.title}</h2>
        <div class="now-left"><span class="big num">${big.v}</span><span class="cap"><b>${big.k}</b>${big.s}</span></div>
      </div>
      <div class="pips" aria-label="15분 단위 진행"><span class="lbl">15′ × ${Math.ceil(len / 15)}</span>${pips}</div>
      <div class="sec-label"><span class="kr">이 블록의 숙제</span><span>[${String(list.length).padStart(2, '0')}]</span></div>
      <div class="hw-list" role="radiogroup" aria-label="숙제 선택">${cards}</div>
      <div class="now-actions">${actions}</div>
      ${nx ? `<button class="next-row" data-act="selblock" data-id="${nx.id}" style="--c:${nx.c}"><span class="k">NEXT</span><span class="sw"></span><b>${nx.title}</b><span class="num">${nx.start}</span><span class="arr">${ic('arrow', 15)}</span></button>` : ''}`;
    document.getElementById('nowLink').innerHTML = `${ic('link', 12)}PL ${b.start}`;
    tickTimer();
  }

  // ---------- TODAY ----------
  function todayNums() {
    const n = clockMin(), worked = Math.floor(S.workedSec / 60);
    const planTotal = 140;
    const planned = blocks.filter(b => !b.fixed && toMin(b.end) > n).reduce((s, b) => s + toMin(b.end) - Math.max(toMin(b.start), n), 0);
    const plannedRem = clamp(planned - worked, 0, 999);
    const avail = Math.max(0, BED - n);
    const completed = 56 + worked;
    return { planTotal, plannedRem, avail, completed, unalloc: Math.max(0, avail - plannedRem) };
  }
  function tile(segs, key, past) {
    const q = [25, 50, 75].map(p => `<span class="q${past ? '' : ' dk'}" style="left:${p}%"></span>`).join('');
    return `<div class="tile${past ? ' past' : ''}">${segs.map((s, i) => `<span class="s ${s.t}" data-k="${key}-${i}" data-p="${s.w}" style="left:${s.l}%;width:${prevW[key + '-' + i] ?? 0}%"></span>`).join('')}${q}</div>`;
  }
  function renderToday() {
    const d = todayNums();
    const pastN = Math.max(1, Math.ceil(d.completed / 60));
    let html = '';
    for (let i = 0; i < pastN; i++) {
      const w = clamp(d.completed - i * 60, 0, 60) / 60 * 100;
      html += `<div class="tile-wrap" style="flex:.8">${tile([{ t: 'done', l: 0, w }], 'tp' + i, true)}<span class="tile-lbl">${i === 0 ? 'DONE' : ''}</span></div>`;
    }
    html += `<span class="now-mark" aria-hidden="true"><span class="num">${hm(clockMin())}</span></span>`;
    const n = Math.max(1, Math.ceil(d.avail / 60));
    for (let i = 0; i < n; i++) {
      const a = i * 60, z = a + 60, segs = [];
      const pS = clamp(d.plannedRem - a, 0, 60);
      if (pS > 0) segs.push({ t: 'plan', l: 0, w: pS / 60 * 100 });
      const fEnd = clamp(d.avail - a, 0, 60);
      if (fEnd > pS) segs.push({ t: 'free', l: pS / 60 * 100, w: (fEnd - pS) / 60 * 100 });
      html += `<div class="tile-wrap">${tile(segs, 'tf' + i, false)}<span class="tile-lbl">${Math.min(z, d.avail) === z ? `+${i + 1}H` : `+${d.avail - a}M`}</span></div>`;
    }
    const s0 = toMin('17:00'), s1 = BED, span = s1 - s0;
    const bars = blocks.map(b => {
      const l = (toMin(b.start) - s0) / span * 100, w = (toMin(b.end) - toMin(b.start)) / span * 100;
      const bg = b.fixed ? 'rgba(241,240,236,.1)' : blockState(b) === 'done' ? 'var(--ink)' : 'var(--plan)';
      return `<i style="left:${l}%;width:${w}%;background:${bg}" title="${b.title}"></i>`;
    }).join('');
    const nowL = (clockMin() - s0) / span * 100;
    const ax = ['17:00', '18:00', '19:00', '20:00', '21:00', '22:00', '23:00', '23:20'].map(t => `<span style="left:${(toMin(t) - s0) / span * 100}%">${t}</span>`).join('');
    document.getElementById('b-today').innerHTML = `
      <div class="td-head"><span class="td-big num">${hmShort(d.avail)}</span><span class="td-cap"><b>H:MM AVAILABLE</b>남은 가용 시간 · 취침 23:20까지</span><span class="td-key"><i></i>1 Block = 1H</span></div>
      <div class="tiles">${html}</div>
      <div class="legend">
        <span class="done"><i></i>완료 <b class="num">${dur(d.completed)}</b></span>
        <span class="plan"><i></i>계획 남음 <b class="num">${dur(d.plannedRem)}</b><span class="of">/ 오늘 ${dur(d.planTotal)}</span></span>
        <span class="free"><i></i>미배정 <b class="num">${dur(d.unalloc)}</b></span>
      </div>
      <div class="strip"><div class="sec-label" style="margin-top:0"><span class="kr">시간대별 흐름</span><span>17:00 — 23:20</span></div>
        <div class="strip-bar">${bars}<span style="position:absolute;top:0;bottom:0;left:${nowL}%;width:2px;background:var(--hot)"></span></div>
        <div class="strip-ax">${ax}</div></div>`;
  }

  // ---------- DEADLINES ----------
  function dlRow(t, tag) {
    const lv = urgency(t), e = estimate(t), [dbg, dfg] = DUE[lv], c = t.done >= t.total;
    const note = t.note && !c ? `<div class="dl-note ${t.risk === 'high' ? 'risk' : 'watch'}"><i></i>${t.note}</div>` : '';
    return `<button class="dl-row lv-${lv}${c ? ' complete' : ''}" data-act="opentask" data-id="${t.id}" data-task="${t.id}" style="--rail:${RAIL[lv]};--dbg:${dbg};--dfg:${dfg}">
      <span class="rail"></span>
      <div style="min-width:0">${tag ? `<div class="dl-tag">${tag}</div>` : ''}<div class="dl-title">${t.title}</div>${note}</div>
      <div class="dl-prog">${prog(t, 'dl-' + t.id)}<span class="dl-count num"><span><b>${t.done}</b> / ${t.total}${t.unit}</span><span>${Math.round(t.done / t.total * 100)}%</span></span></div>
      <div class="dl-due"><span class="due-chip">${c ? '완료' : ddayTxt(t.dday)}</span><span class="due-date">${t.date}</span></div>
      <div class="dl-est">${e.main}<small>${e.sub || '남은 작업'}</small></div>
    </button>`;
  }
  function ring(p, c) {
    const r = 11, C = 2 * Math.PI * r;
    return `<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="${r}" fill="none" stroke="rgba(241,240,236,.1)" stroke-width="4"/><circle cx="14" cy="14" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" transform="rotate(-90 14 14)" style="transition:stroke-dashoffset 1s var(--spring)"/></svg>`;
  }
  function renderDl() {
    let html = '';
    if (S.sort === 'group') {
      groups.forEach(g => {
        const ts = tasks.filter(t => t.g === g.id).sort((a, b) => a.dday - b.dday);
        const left = ts.filter(t => t.done < t.total);
        const mins = left.reduce((s, t) => s + (t.total - t.done) * t.pace, 0);
        const p = ts.reduce((s, t) => s + t.done / t.total, 0) / ts.length;
        const soon = left.length ? Math.min(...left.map(t => t.dday)) : null;
        const risky = left.some(t => t.risk === 'high');
        html += `<div class="grp${S.open[g.id] ? ' open' : ''}" data-g="${g.id}" style="--c:${g.c}">
          <button class="grp-h" data-act="group" data-id="${g.id}" aria-expanded="${!!S.open[g.id]}">
            <span class="badge">${g.badge}</span>
            <span><div class="grp-name">${g.name}${g.sub ? `<em> · ${g.sub}</em>` : ''}</div>
            <div class="grp-meta">남은 숙제 ${left.length}개 · 약 ${dur(r10(mins))}${soon !== null ? ` · 가장 빠른 마감 ${ddayTxt(soon)}` : ''}${risky ? ' · <span class="warn">시간 빠듯</span>' : ''}</div></span>
            <span class="grp-right"><span class="grp-pct">${Math.round(p * 100)}%</span>${ring(p, g.c)}<span class="chev">${ic('chevron', 18)}</span></span>
          </button>
          <div class="grp-b"><div><div class="grp-items">${ts.map(t => dlRow(t)).join('')}</div></div></div>
        </div>`;
      });
    } else {
      const ts = [...tasks].sort((a, b) => (a.done >= a.total) - (b.done >= b.total) || a.dday - b.dday || (b.risk === 'high') - (a.risk === 'high'));
      html = `<div class="grp open"><div class="grp-items">${ts.map(t => { const g = groupOf(t); return dlRow(t, `${g.name}${g.sub ? ' · ' + g.sub : ''}`); }).join('')}</div></div>`;
    }
    html += `<div class="dl-legend"><span><i style="background:${RAIL.calm}"></i>여유</span><span><i style="background:${RAIL.attention}"></i>주의</span><span><i style="background:${RAIL.near}"></i>임박</span><span class="sep"></span><span><i style="background:var(--red)"></i>마감 전 끝내기 어려움</span></div>`;
    document.getElementById('b-dl').innerHTML = html;
    document.querySelectorAll('[data-act="sort"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sort === S.sort)));
  }

  // ---------- PLANNER ----------
  function renderPl() {
    const n = clockMin();
    const rows = [];
    blocks.forEach((b, i) => {
      const len = toMin(b.end) - toMin(b.start);
      if (b.fixed) {
        rows.push(`<div class="pl-row fixed small" style="--c:var(--ink4)"><span class="pl-time num">${b.start}</span><span class="pl-rail"><i></i></span><span class="pl-card"><span class="pl-title">${b.title} · ${dur(len)}</span></span></div>`);
      } else {
        const st = blockState(b), ts = b.tasks.map(T);
        const pill = st === 'now' ? '<span class="pill live"><i></i>Now</span>' : st === 'done' ? `<span class="pill done">${ic('check', 11)}Done</span>` : '';
        const nowbar = st === 'now' ? `<span class="pl-nowbar"><i data-k="pl-nb" data-p="${(n - toMin(b.start)) / len * 100}" style="width:${prevW['pl-nb'] ?? 0}%"></i></span>` : '';
        rows.push(`<button class="pl-row st-${st}${S.selBlock === b.id ? ' sel' : ''}" data-act="selblock" data-id="${b.id}" data-tasks="${b.tasks.join(' ')}" style="--c:${b.c};--h:${Math.max(64, len * 1.35)}px" aria-pressed="${S.selBlock === b.id}">
          <span class="pl-time num">${b.start}<small>${b.end}</small></span><span class="pl-rail"><i></i></span>
          <span class="pl-card"><span class="pl-title">${b.title}${pill}</span><span class="pl-sub">${dur(len)} · ${ts.map(t => t.title).join(', ')}</span>${nowbar}</span>
        </button>`);
      }
      const nx = blocks[i + 1], gapEnd = nx ? toMin(nx.start) : BED, gap = gapEnd - toMin(b.end);
      if (gap >= 12 && toMin(b.end) >= toMin('18:40')) {
        rows.push(`<div class="pl-row gap small" style="--c:var(--ink4)"><span class="pl-time num">${b.end}</span><span class="pl-rail"><i></i></span><span class="pl-card"><span class="pl-title">${ic('plus', 13)}미배정 ${dur(gap)}</span></span></div>`);
      }
    });
    rows.push(`<div class="pl-row fixed small" style="--c:var(--ink)"><span class="pl-time num">23:20</span><span class="pl-rail"><i></i></span><span class="pl-card"><span class="pl-title">취침</span></span></div>`);
    const sb = B(S.selBlock);
    const detail = `<div class="pl-detail"><div class="pl-detail-card" style="--c:${sb.c}">
      <div class="pd-k">Selected · NOW에 연결됨</div>
      <div class="pd-t">${sb.title}</div>
      <div class="pd-m num">${sb.start}–${sb.end} · ${dur(toMin(sb.end) - toMin(sb.start))}</div>
      <div class="sec-label"><span class="kr">연결된 숙제</span><span>[${String(sb.tasks.length).padStart(2, '0')}]</span></div>
      ${sb.tasks.map(T).map(t => `<div class="pd-task" data-task="${t.id}"><span class="t">${t.title}</span>${prog(t, 'pd-' + t.id)}<span class="c"><span class="num">${t.done} / ${t.total}${t.unit}</span><span>${groupOf(t).name} · ${ddayTxt(t.dday)}</span></span></div>`).join('')}
    </div></div>`;
    document.getElementById('b-pl').innerHTML = `<div class="pl-wrap"><div class="pl-list">${rows.join('')}</div>${detail}</div>`;
  }

  // ---------- Dock ----------
  function renderDock() {
    const items = [['now', '01', '지금 공부', 'var(--ink)'], ['today', '02', '오늘', 'var(--ink2)'], ['dl', '03', '마감', 'var(--ink2)'], ['pl', '04', '플래너', 'var(--ink2)']];
    document.getElementById('dock').innerHTML = items.map(([id, ab, lb, c]) => {
      const off = !!S.closed[id];
      return `<button data-act="dock" data-id="${id}" class="${off ? 'off' : ''}${S.collapsed[id] && !off ? ' min' : ''}" style="--c:${c}" aria-label="${NAMES[id]} ${lb} ${off ? '창 다시 열기' : '창 앞으로'}"><span class="di">${ab}</span>${lb}${off ? '<span class="st">OPEN</span>' : ''}</button>`;
    }).join('');
  }

  // ---------- Render all ----------
  function render() {
    renderNow(); renderToday(); renderDl(); renderPl();
    flush();
    S.pop = null;
  }

  // ---------- Timer ----------
  function tickTimer() {
    const el = document.getElementById('timer');
    if (el && S.running) { const s = Math.floor((Date.now() - S.running.t0) / 1000); el.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
    document.getElementById('clock').textContent = hm(clockMin());
  }
  let lastMin = clockMin(), lastWorkedMin = 0;
  setInterval(() => {
    if (S.running) S.workedSec = S.running.base + Math.floor((Date.now() - S.running.t0) / 1000);
    tickTimer();
    const wm = Math.floor(S.workedSec / 60);
    if (clockMin() !== lastMin || wm !== lastWorkedMin) { lastMin = clockMin(); lastWorkedMin = wm; render(); }
  }, 1000);

  // ---------- Toast ----------
  let tt;
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

  // ---------- Actions ----------
  function selectBlock(id, hw) {
    if (S.running) { toast('진행 중인 숙제를 종료한 뒤 블록을 바꿀 수 있어요'); return; }
    S.selBlock = id; if (hw) S.selHw[id] = hw;
    render();
    win('now').animate([{ boxShadow: '0 0 0 6px rgba(241,240,236,.35)' }, { boxShadow: '0 0 0 0 rgba(241,240,236,0)' }], { duration: 700, easing: 'ease-out' });
  }
  function toFree(msg) {
    if (S.mode === 'free') return;
    const o = orgRects();
    ids.forEach(id => { if (o[id]) S.free[id] = { ...o[id], h: S.collapsed[id] ? (S.free[id]?.h || 400) : o[id].h }; });
    S.mode = 'free'; applyLayout(); if (msg) toast(msg);
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act, w = a.closest('.win'), wid = w && w.dataset.id;
    switch (act) {
      case 'mode':
        if (a.dataset.mode === 'free') toFree(); else { S.mode = 'organized'; applyLayout(); }
        break;
      case 'reset': S.free = freeDefault(); S.collapsed = {}; S.closed = {}; applyLayout(); break;
      case 'collapse': if (S.focus === wid) S.focus = null; S.collapsed[wid] = !S.collapsed[wid]; applyLayout(); break;
      case 'focus': S.focus = S.focus === wid ? null : wid; if (S.focus) front(wid); applyLayout(); break;
      case 'close':
        if (S.focus === wid) S.focus = null;
        S.closed[wid] = true; applyLayout();
        toast(`${NAMES[wid]} 창을 닫았어요 · 아래 독에서 다시 열 수 있어요`);
        break;
      case 'unfocus': S.focus = null; applyLayout(); break;
      case 'dock': {
        const id = a.dataset.id;
        S.closed[id] = false; S.collapsed[id] = false; front(id); applyLayout();
        break;
      }
      case 'sort': S.sort = a.dataset.sort; render(); break;
      case 'group': {
        const g = a.dataset.id; S.open[g] = !S.open[g];
        a.closest('.grp').classList.toggle('open', S.open[g]); a.setAttribute('aria-expanded', String(S.open[g]));
        break;
      }
      case 'selblock': selectBlock(a.dataset.id); break;
      case 'opentask': {
        const b = blockOfTask(a.dataset.id);
        if (b) { selectBlock(b.id, a.dataset.id); if (!S.running) toast(`NOW에 ‘${b.title}’ 블록을 표시했어요`); }
        else toast('아직 플래너 블록에 배치되지 않은 숙제예요');
        break;
      }
      case 'selhw': if (S.running) { toast('진행 중에는 숙제를 바꿀 수 없어요'); break; } S.selHw[S.selBlock] = a.dataset.id; renderNow(); flush(); break;
      case 'start': S.running = { block: S.selBlock, task: S.selHw[S.selBlock], t0: Date.now(), base: S.workedSec }; render(); break;
      case 'stop': S.running = null; render(); toast('기록했어요 · 오늘 완료 시간에 반영됨'); break;
      case 'plus': { const t = T(S.running.task); if (t.done < t.total) { t.done++; S.pop = t.id; } if (t.done >= t.total) toast(`‘${t.title}’ 완료!`); render(); break; }
      case 'minus': { const t = T(S.running.task); if (t.done > 0) t.done--; render(); break; }
    }
  });
  function flush() { requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('[data-k]').forEach(el => { el.style.width = el.dataset.p + '%'; prevW[el.dataset.k] = +el.dataset.p; }))); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.focus) { S.focus = null; applyLayout(); } });

  // hover link: deadline/NOW task ↔ planner block
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-task]');
    document.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
    if (!t) return;
    const id = t.dataset.task;
    document.querySelectorAll(`.pl-row[data-tasks~="${id}"], .dl-row[data-task="${id}"]`).forEach(x => x.classList.add('hl'));
  });

  // ---------- Drag & resize ----------
  let scale = 1;
  stage.addEventListener('pointerdown', e => {
    const w = e.target.closest('.win'); if (!w) return;
    const id = w.dataset.id;
    if (S.mode === 'free' && !S.focus) { front(id); ids.forEach(x => { win(x).style.zIndex = 10 + S.order.indexOf(x); win(x).classList.toggle('front', S.order[S.order.length - 1] === x); }); }
    const head = e.target.closest('.wh'), rz = e.target.closest('.rz');
    if ((!head && !rz) || e.target.closest('button') || S.focus) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let started = false, r0;
    const move = ev => {
      const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
      if (!started) {
        if (Math.hypot(dx, dy) < 4) return;
        started = true;
        toFree(head ? '자유 모드로 전환했어요 · 창을 원하는 곳에 두세요' : null);
        r0 = { ...S.free[id] };
        w.classList.add(head ? 'dragging' : 'resizing');
      }
      const r = S.free[id];
      if (head) {
        r.x = clamp(r0.x + dx, -r.w + 120, W - 120); r.y = clamp(r0.y + dy, TOP - 10, H - HEAD);
        w.style.left = r.x + 'px'; w.style.top = r.y + 'px';
      } else {
        r.w = clamp(r0.w + dx, 340, W - r.x - 8); r.h = clamp(r0.h + dy, 200, H - r.y - 8);
        w.style.width = r.w + 'px'; w.style.height = r.h + 'px';
      }
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); w.classList.remove('dragging', 'resizing'); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
  stage.addEventListener('dblclick', e => {
    const h = e.target.closest('.wh'); if (!h || e.target.closest('button')) return;
    const id = h.closest('.win').dataset.id; S.focus = S.focus === id ? null : id; if (S.focus) front(id); applyLayout();
  });

  // ---------- Fit to viewport ----------
  function fit() {
    scale = Math.min(1, document.documentElement.clientWidth / W);
    stage.style.transform = `scale(${scale})`;
    document.body.style.height = H * scale + 'px';
  }
  window.addEventListener('resize', fit);
  fit(); applyLayout(); render();
  document.fonts && document.fonts.ready.then(applyLayout);
})();
</script>
</body>
</html>
